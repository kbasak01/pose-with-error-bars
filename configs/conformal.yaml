# Conformal study configuration — DRAFT from the starter kit.
# Phase 1 finalises it; any later change gets a docs/DECISIONS.md entry.

p1:
  submodule: external/spacecraft-pose-baseline
  tag: phase-9-complete
  commit: 0f81b426e0a7a7ec26369fb31ad1ea19161434a1
  primary_run: keypoint_a2
  secondary_runs: [keypoint_a1]          # robustness check of the conclusions
  crop_sources: [predicted_crop, gt_crop] # gt_crop is ORACLE on HIL domains
  # Checkpoints whose SHA-256 Phase 0 verifies against the phase-9-complete release SHA256SUMS.txt.
  checkpoints: [detector, keypoint_a1, keypoint_a2, direct_regression_a1]

splits:
  seed: 20261006
  synthetic_validation:
    val_tune: 0.20
    val_cal: 0.40
    val_test: 0.40
  hil:
    pool_a: 0.50     # unlabeled images for weighted CP; labels only for oracle_* arms
    pool_b: 0.50     # evaluation only, every arm, forever
  manifest_dir: splits

alpha_grid: [0.01, 0.02, 0.05, 0.10, 0.15, 0.20, 0.30, 0.50]
headline_alpha: 0.10

conventions: [abstain_allowed, answer_required]

level_a:                    # Phase 2: in-distribution only, synthetic val_test; no HIL
  scores: [A1, A2, A3]
  fit_split: synthetic_val_tune          # normalisers + g(conf)
  calibration_split: synthetic_val_cal
  test_split: synthetic_val_test
  sidecar_check_tolerance:               # join check: recomputed vs P1-committed errors
    e_r_rad: 1.0e-4
    e_t_m: 1.0e-4
  gate:
    ks_min_p: 0.01                       # KS against the atom-aware re-split law
    mean_band_se: 3                      # mean within this many MC s.e.

level_b:                    # Phase 4: in-distribution only, synthetic val_test; no HIL
  scores: [B1, B2]
  run: keypoint_a2
  crop_source: predicted_crop
  calibration_split: synthetic_val_cal
  test_split: synthetic_val_test
  valid_mask: pnp_success                # shared answer rate with Level A
  label_projection_max_px: 0.01          # projected label pose vs P1's stored keypoint product
  cov_mapping_rtol: 1.0e-9               # stored heatmap_cov_full vs propagate.crop_cov_to_full
  level_a_result: results/level_a/keypoint_a2_predicted_crop_synthetic.json
  gate:
    ks_min_p: 0.01                       # KS against the atom-aware re-split law
    mean_band_se: 3                      # mean within this many MC s.e.
    purse_agreement: 1.0                 # PURSE(label pose) == joint coverage on every frame

level_c:                    # Phase 5: in-distribution only, synthetic val_test; no HIL
  scores: [C1, C2]
  run: keypoint_a2
  crop_source: predicted_crop
  fit_split: synthetic_val_tune          # head selection + the head-quality NLL rescaling only
  calibration_split: synthetic_val_cal
  test_split: synthetic_val_test
  valid_mask: pnp_success                # C2 additionally needs a defined linearised sigma
  label_projection_max_px: 0.01
  cov_mapping_rtol: 1.0e-9               # vhead_cov_full vs propagate.crop_cov_to_full
  level_a_result: results/level_a/keypoint_a2_predicted_crop_synthetic.json
  level_b_result: results/level_b/keypoint_a2_predicted_crop_synthetic.json
  gate:
    ks_min_p: 0.01                       # KS against the atom-aware re-split law
    mean_band_se: 3                      # mean within this many MC s.e.

dump:                       # Phase 3: per-frame prediction dump + P1 parity gate
  run: keypoint_a2
  domains: [synthetic, lightbox, sunlamp]
  arms: [predicted_crop, gt_crop]        # gt_crop = P1's pipeline_gt_crop path; oracle on HIL
  batch_size: 48                         # P1 keypoint_a2 train.batch_size: both P1 eval stages batch by it
  solve_workers: 16                      # P1 runtime.num_workers: sets P1's PnP chunk seeding
  solve_seed: 1337                       # P1 runtime.seed
  decode_threads: 8
  subset_size: 256                       # frames whose heatmaps + decoder features are kept
  subset_seed: 1337
  tf32: false
  moment_mean_tol_crop_px: 1.0e-3        # heatmap-moment mean vs P1 coordinate, non-empty channels
  parity_gate:
    flag_agreement_min: 0.999            # per domain x arm
    median_abs_de_r_max_rad: 1.0e-6      # on frames both solved
    solved_count_exact: true             # "solve rates match P1's JSON to the reported precision"
  max_disagreements_listed: 10

shift:                      # Phase 6: the coverage-under-shift matrix (engine/shift.py)
  run: keypoint_a2
  scores: [A1, A2, A3, B1, B2, C1, C2]
  domains: [synthetic, lightbox, sunlamp]
  crop_sources: [predicted_crop, gt_crop]  # gt_crop is oracle_gt_box on HIL (dump meta)
  fit_split: synthetic_val_tune            # normalisers, g(conf), Mondrian edges, slice edges
  calibration_split: synthetic_val_cal
  test_subsets:                            # evaluation only
    synthetic: synthetic_val_test
    lightbox: lightbox_poolB
    sunlamp: sunlamp_poolB
  target_pools:                            # weighted: features only; oracle: labels (oracle tag)
    lightbox: lightbox_poolA
    sunlamp: sunlamp_poolA
  arms:                                    # which arm runs where; every other cell is explained
    synthetic: [split, mondrian]
    hil: [split, mondrian, weighted_unlabeled_target, oracle_target_labels]
  weighted_crop_sources: [predicted_crop]  # gt_crop features are GT-box-conditioned (L2)
  classifier:                              # fixed up front; never tuned on HIL anything
    C: 1.0
    max_iter: 5000
    standardise: true
    cv_folds: 5
    cv_seed: 1337
  oracle_seed: 20261007
  normaliser_check_rtol: 1.0e-4            # dump (float64) refit vs Phase 2 (P1 sidecar, float32)
  level_a_result: results/level_a/keypoint_a2_predicted_crop_synthetic.json
  slices_alpha: 0.10                       # conditional slices at the headline alpha only
  out_dir: results/shift

repeated_splits:
  n_resplits: 1000          # random re-splits of val_cal ∪ val_test for coverage distributions
  seed: 1337

scores:
  A1: {level: pose, normalisers: [c_R, c_t]}
  A2: {level: pose, normalisers: [c_R, c_z, c_xy]}
  A3: {level: pose, normalisers: [c_R, c_t], difficulty: isotonic_mean_confidence}
  B1: {level: keypoint, normaliser: predicted_box_diagonal}
  B2: {level: keypoint, covariance: heatmap_second_moment}
  C1: {level: keypoint, covariance: variance_head}
  C2: {level: pose, normaliser: linearised_pose_std_from_C1}
  keypoint_inclusion: gt_projection_in_full_frame   # same rule at calibration and evaluation
  normaliser_statistic: median_on_val_tune_solved

arms:
  split: {}
  mondrian:
    groups: [predicted_range_tertile, mean_confidence_tertile]
    edges_fit_on: val_tune
  weighted_unlabeled_target:
    features: p1_encoder_global_avgpool   # 512-d, from the dump
    classifier: logistic_regression
    cv_folds: 5
    weight_clip_quantile: null            # chosen on val_tune only, if at all; record the choice
  oracle_target_labels:
    n_values: [25, 50, 100, 250, 500, 1000]
    draws_per_n: 5
  aci_online:                             # stretch
    gamma: 0.005
    order_seed: 7

propagation:               # Phase 4: keypoint sets -> pose-space extent (conformal/propagate.py)
  linearised: {enabled: true}            # every alpha; inner + outer radii (approximation, not a bound)
  sampled:
    enabled: true
    samples: 256                         # M keypoint configurations per frame
    offline_only: true
    alpha: 0.10                          # headline alpha only
    seed: 1337                           # per-frame SeedSequence([seed, score, convention, row])
    workers: 16
    max_frames: null                     # all answered val_test frames (pilot: ~35 ms / frame)

reporting:
  confidence_interval: clopper_pearson_95
  conditional_slices:
    gt_range_tertiles: true
    gt_bbox_iou_bins: [0.0, 0.5, 0.8, 1.0]
    confidence_quintiles: true

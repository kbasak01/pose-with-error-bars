name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # CPU-only runner. Anything needing a GPU, the SPEED+ dataset or P1 checkpoints is marked
    # @pytest.mark.gpu / @pytest.mark.dataset / @pytest.mark.slow and excluded here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # P1 (read-only) at its pinned commit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only dependencies
        # P1's CPU pins first; the extras are constrained by them so they cannot move torch/numpy.
        run: |
          python -m pip install --upgrade pip
          pip install -r external/spacecraft-pose-baseline/requirements-ci.txt
          pip install -e external/spacecraft-pose-baseline --no-deps
          pip install -r requirements-extra.txt -c external/spacecraft-pose-baseline/requirements-ci.txt
          pip install -e . --no-deps

      - name: Import check
        run: python -c "import speedpose, poseconf; print('ok')"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Unit tests
        run: pytest -q -m "not slow and not gpu and not dataset" tests

      - name: Smoke (no dataset, no GPU)
        run: make smoke
